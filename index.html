<style>
:root{
  --accent:#6d5dfc; --accent-2:#5a4ae0; --accent-soft:#eceafe;
  --ink:#26244d; --muted:#5c5a80; --faint:#8886a8; --line:#e4e2f2;
  --card:#ffffff; --field:#ffffff; --well:#f2f0fb; --page:#f7f6fd;
  --glow:radial-gradient(40rem 30rem at 8% 0%,rgba(150,135,255,.20),transparent 60%),
         radial-gradient(38rem 30rem at 95% 12%,rgba(109,93,252,.12),transparent 60%);
  --ok:#0a7f5a; --warn:#b45309; --danger:#c62828;
  --chip-term:#0369a1; --chip-concept:#6d5dfc; --chip-theorem:#0a7f5a;
  --chip-trap:#c62828; --chip-method:#b45309;
  --sh:0 8px 26px rgba(38,36,77,.08); --r:14px;
}
html[data-theme=dark]{
  --accent:#8f83ff; --accent-2:#a89eff; --accent-soft:rgba(143,131,255,.18);
  --ink:#e8e6f7; --muted:#b3b0d0; --faint:#8a87ad; --line:#33315a;
  --card:#1d1b38; --field:#171530; --well:#252245; --page:#12102a;
  --glow:radial-gradient(40rem 34rem at 10% 10%,rgba(90,74,224,.30),transparent 60%),
         radial-gradient(38rem 32rem at 90% 90%,rgba(56,40,180,.25),transparent 62%);
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
  --chip-term:#7dd3fc; --chip-concept:#a89eff; --chip-theorem:#34d399;
  --chip-trap:#f87171; --chip-method:#fbbf24;
  --sh:0 10px 30px rgba(0,0,10,.45);
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
  background:var(--page);background-image:var(--glow);background-attachment:fixed;
  color:var(--ink);min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;gap:10px;padding:10px 2px}
header h1{font-size:20px;letter-spacing:.5px}
header .build{font-size:11px;color:var(--faint)}
header .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:10px;padding:5px 10px;cursor:pointer;font-size:13px}

/* ---------- 刷:信息流 ---------- */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px 6px;margin-bottom:10px;box-shadow:var(--sh)}
.fhead{display:flex;gap:10px;align-items:flex-start}
.fav{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:18px;background:var(--accent-soft);border:1px solid var(--line)}
.fwho{font-weight:600;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:5px}
.fv{font-size:11px;background:var(--accent);color:#fff;border-radius:4px;padding:0 4px;line-height:15px}
.fmeta{font-size:12px;color:var(--faint);margin-top:1px}
.fbody{margin:8px 0 4px;font-size:15px;line-height:1.72;word-break:break-word}
.fbody p{margin:.35em 0}
.fbody h1,.fbody h2,.fbody h3{font-size:15px;margin:.5em 0 .2em}
.fquote{border-left:3px solid var(--accent-soft);padding:4px 0 4px 10px;color:var(--muted);
  font-size:14px;margin:6px 0}
.fbar{display:flex;border-top:1px solid var(--line);margin-top:8px}
.fbar button{flex:1;border:0;background:none;color:var(--muted);font-size:13px;padding:9px 0;
  cursor:pointer;border-radius:8px}
.fbar button:hover{background:var(--well);color:var(--ink)}
.fbar button.did{color:var(--accent);font-weight:600}
.ftag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;
  background:var(--well);color:var(--muted);margin-right:5px}
.fend{text-align:center;color:var(--faint);font-size:13px;padding:18px 0}
.fstat{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;margin-bottom:10px}
.fstat b{color:var(--ink);font-size:15px}
.fquiz{background:var(--well);border-radius:10px;padding:9px 11px;margin-top:6px;font-size:14px}
.fquiz summary{cursor:pointer;color:var(--accent);font-weight:600}
nav{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:4px 0 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);font-size:15px;padding:9px 13px;
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .n{font-size:12px;color:var(--faint);font-weight:400}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;
  border:1px solid currentColor;vertical-align:1px}
.k-term{color:var(--chip-term)}.k-concept{color:var(--chip-concept)}
.k-theorem{color:var(--chip-theorem)}.k-trap{color:var(--chip-trap)}.k-method{color:var(--chip-method)}
.st-stub{color:var(--warn)}.st-draft{color:var(--chip-term)}.st-done{color:var(--ok)}
.srcbtn{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--line);
  background:var(--well);border-radius:8px;padding:2px 9px;margin:2px 4px 2px 0;text-decoration:none}
.row{padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{font-size:14.5px}
.row .m{font-size:12px;color:var(--faint)}
.md{font-size:14.5px}
.md p{margin:.5em 0}.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md h1,.md h2,.md h3{font-size:1.05em;margin:.8em 0 .3em}
.md code{background:var(--well);padding:1px 5px;border-radius:5px;font-size:.92em}
.md pre{background:var(--well);padding:10px;border-radius:9px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--muted);margin:.5em 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:3px 9px;font-size:13.5px}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--faint);font-size:13px;padding:8px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label{font-size:12.5px;color:var(--muted);display:block;margin:9px 0 3px}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-size:14px;
  border-radius:10px;padding:8px 18px;cursor:pointer}
.btn.ghost{background:var(--well);color:var(--ink);border:1px solid var(--line)}
.btn.mini{font-size:12px;padding:3px 10px;border-radius:8px}
.fab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:26px;border:0;cursor:pointer;
  box-shadow:0 8px 22px rgba(109,93,252,.45)}
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.45);display:none;
  align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow-y:auto}
.overlay.on{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:760px;width:100%;
  padding:20px 22px;box-shadow:var(--sh);margin-bottom:6vh}
.sheet h3{font-size:17px;margin-bottom:4px}
.toolrow{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.toolrow input[type=date]{width:auto}
.toolrow input[type=search]{flex:1;min-width:140px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:6px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.stars{color:var(--warn);letter-spacing:1px}
.login{max-width:360px;margin:16vh auto;text-align:center}
.login .card{padding:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);
  color:var(--page);padding:8px 18px;border-radius:99px;font-size:13.5px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.kp-body{margin-top:8px}
details.kps{margin-top:6px}
details.kps summary{cursor:pointer;font-size:13px;color:var(--accent)}
.kpitem{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kpitem:last-child{border-bottom:0}
@media (max-width:560px){.wrap{padding:8px 8px 90px}.card{padding:12px}}
</style>
</head>

<script>
const BUILD='2026-09-01b';
const SUPA_URL='https://kbcftsexzmxjtlljgcyi.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiY2Z0c2V4em14anRsbGpnY3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTAwMzMsImV4cCI6MjA5NDYyNjAzM30.YGKOjmNzNPI-d4A6nDtFdYsExRqvERoY_7IctbMIN1A';
const TZ='America/New_York';
let COURSES={};  // 课程名从数据库取(私有),不写进公开页面
const KINDZH={term:'术语',concept:'概念',theorem:'定理',trap:'易错',method:'方法'};
const STZH={stub:'待写',draft:'草稿',done:'成稿'};
let sb=null, D={kp:[],lec:[],qa:[],rq:[],sl:[]}, cur='feed', selDate=todayStr();

document.getElementById('build').textContent='build '+BUILD;
if(localStorage.getItem('learn-theme')==='dark'||
   (!localStorage.getItem('learn-theme')&&matchMedia('(prefers-color-scheme: dark)').matches))
  document.documentElement.setAttribute('data-theme','dark');
function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  localStorage.setItem('learn-theme',d?'light':'dark');
}
function todayStr(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function md(s){
  if(!s)return'';
  s=s.replace(/\[\[([a-z0-9-]+)\]\]/g,(m,slug)=>{
    const k=D.kp.find(x=>x.slug===slug);
    if(!k)return m;
    return `<a href="javascript:void(0)" onclick="openKPslug('${slug}')">${esc(k.title_zh||k.title_en)}</a>`;
  });
  // 数学片段先抽出护住,marked 跑完再放回,否则 \{ \\ _ 会被当 markdown 吃掉
  const store=[];
  s=s.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g,m=>{store.push(m);return '@@MATH'+(store.length-1)+'@@';});
  let html=marked.parse(s,{mangle:false,headerIds:false});
  html=html.replace(/@@MATH(\d+)@@/g,(_,i)=>esc(store[+i]));
  return html;
}
function openKPslug(slug){
  const k=D.kp.find(x=>x.slug===slug);
  if(k){closeOv();openKP(k.id);}
}
function mathify(el){
  if(window.renderMathInElement)renderMathInElement(el,{delimiters:[
    {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
    {left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
    throwOnError:false});
}

/* ---------- auth ---------- */
sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
async function boot(){
  const {data}=await sb.auth.getSession();
  show(!!(data&&data.session));
  sb.auth.onAuthStateChange((_e,s)=>show(!!s));
}
async function sendLink(){
  const email=document.getElementById('email').value.trim();
  if(!email)return;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});
  document.getElementById('loginmsg').textContent=error?('失败: '+error.message):'链接已发,去邮箱点开';
}
async function logout(){await sb.auth.signOut();location.reload();}
let booted=false;
function show(logged){
  document.getElementById('login').style.display=logged?'none':'block';
  document.getElementById('app').style.display=logged?'block':'none';
  document.getElementById('fab').style.display=logged?'block':'none';
  if(logged&&!booted){booted=true;loadAll();}
}

/* ---------- data ---------- */
async function loadAll(){
  const [kp,lec,qa,rq,sl,en,hw,fe]=await Promise.all([
    sb.from('knowledge_points').select('*').order('updated_at',{ascending:false}).limit(1000),
    sb.from('lectures').select('*').order('lecture_date',{ascending:false}).limit(400),
    sb.from('qa_log').select('*').order('asked_at',{ascending:false}).limit(500),

  D={kp:kp.data||[],lec:lec.data||[],qa:qa.data||[],rq:rq.data||[],sl:sl.data||[],en:en.data||[],hw:hw.data||[],fe:fe.data||[]};

const ORIGIN_ZH={meeting:'组会/会议',qe:'重点复习',course:'课程',paper:'论文',telegram:'随手记',window:'窗口问答',manual:'手动'};

/* ---------- 刷:信息流(参考微博的三段式卡片) ----------
   设计意图,改之前先读:
   1) 碎片化:知识点正文按 ## 小节切开,一张卡只承载一个小节;术语/英语/问答本身就是原子。
   2) 从最基础开始:每张卡有 level(1 基础 / 2 展开 / 3 推导),没标记过"会了"的主题优先给 level 1。
   3) 接触效应:看过的卡权重按 1/(1+看过次数) 衰减但不归零,隔得越久权重回升——本质是伪装成信息流的间隔重复。
   4) 旧习惯:头像+博主名+"几小时前 来自X"+底部三键,布局照搬微博,肌肉记忆直接迁移。
   5) 不确定性:每批抽样带随机抖动,顺序不可预测;偶尔插入回音卡/小测验卡。
   来源必须一眼可见——"博主名"就是来源,这条与知识库的溯源铁律一致。            */
let FEED=[], feedShown=0, feedSeen={}, feedBatch=12;

function feKey(k){ return feedSeen[k] || (feedSeen[k]={seen:0,liked:false,later:false,last:0}); }
function buildFeedSeen(){
  feedSeen={};
  (D.fe||[]).forEach(e=>{
    const r=feKey(e.card_key), t=new Date(e.at).getTime();
    if(e.action==='seen') r.seen++;
    if(e.action==='like') r.liked=true;
    if(e.action==='later')r.later=true;
    if(t>r.last)r.last=t;
  });
}
function mdFirstPara(t){
  const s=(t||'').split(/\n\s*\n/).find(x=>x.trim() && !x.trim().startsWith('#'))||'';
  return s.length>420? s.slice(0,420)+'…' : s;
}
/* 把讲义级正文切成小节卡 */
function splitSections(body){
  const out=[]; if(!body)return out;
  const parts=body.split(/\n(?=##\s)/);
  parts.forEach((sec,i)=>{
    const m=sec.match(/^##\s*(.+)/);
    const title=m?m[1].trim():'';
    const text=(m?sec.slice(m[0].length):sec).trim();
    if(text.length>40) out.push({title,text:text.length>700?text.slice(0,700)+'…':text,i});
  });
  return out;
}
function buildFeed(){
  buildFeedSeen();
  const C=[];
  const push=(o)=>C.push(o);

  /* 术语:最基础的一层 */
  D.kp.filter(k=>k.kind==='term').forEach(k=>push({
    key:'term:'+k.slug, kind:'term', level:1, who:'术语小抄', av:'📗',
    from:k.topic||'术语', at:k.updated_at,
    title:(k.title_en||'')+(k.title_zh?(' · '+k.title_zh):''),
    body:mdFirstPara(k.body_md)||k.title_zh||'', slug:k.slug }));

  /* 知识点:一句话 + 每个小节各一张 */
  D.kp.filter(k=>k.kind!=='term').forEach(k=>{
    const one=(k.body_md||'').match(/\*\*一句话[:：]\*\*\s*([\s\S]*?)(?:\n\n|$)/);
    if(one) push({key:'kp1:'+k.slug, kind:'kp', level:1, who:k.title_zh||k.slug, av:'💡',
      from:ORIGIN_ZH[k.origin]||'知识库', at:k.updated_at,
      title:'一句话', body:one[1].trim(), slug:k.slug});
    splitSections(k.body_md).forEach(sec=>push({
      key:'kp:'+k.slug+':'+sec.i, kind:'kp', level:(/证明|推导|proof/i.test(sec.title)?3:2),
      who:k.title_zh||k.slug, av:'💡', from:ORIGIN_ZH[k.origin]||'知识库', at:k.updated_at,
      title:sec.title, body:sec.text, slug:k.slug}));
  });

  /* 课程 key_points:天然的原子卡 */
  D.lec.forEach(l=>(l.key_points||[]).forEach((kp,i)=>push({
    key:'lkp:'+l.id+':'+i, kind:'lec', level:kp.importance>=3?2:1,
    who:(COURSES[l.course_code]||l.course_code), av:'🎓',
    from:l.lecture_date+' 那节', at:l.lecture_date+'T12:00:00Z',
    title:kp.title_zh||kp.title_en||'', body:kp.summary_zh||'', lecId:l.id})));

  /* 英语:词 + 原句 */
  (D.en||[]).forEach(e=>push({
    key:'en:'+e.id, kind:'en', level:1, who:'英语', av:'🔤',
    from:e.kind||'word', at:e.asked_at,
    title:e.term, body:e.meaning_zh||e.note_md||'', quote:e.context||'',
    bookPath:e.source_path, bookPage:e.source_page}));

  /* 要读的 paper / 书 */
  (D.rq||[]).filter(r=>r.status!=='done').forEach(r=>push({
    key:'read:'+r.id, kind:'read', level:1, who:r.recommender||'待读', av:'📄',
    from:r.kind||'paper', at:r.created_at,
    title:r.title, body:r.note||'', link:r.link}));

  /* 回音:你自己问过的问题 */
  (D.qa||[]).forEach(q=>push({
    key:'qa:'+q.id, kind:'qa', level:1, who:'你问过', av:'🗣',
    from:(q.window_name||'')+' 窗口', at:q.asked_at,
    title:q.question, body:q.answer_md||'', quiz:true}));

  /* 需要考虑的事 */
  (D.sl||[]).forEach(t=>push({
    key:'sl:'+t.id, kind:'note', level:1, who:'随手记', av:'📌',
    from:t.category||'笔记', at:t.study_on, title:'', body:t.takeaway||'', link:t.link}));

  /* 作业倒计时 */
  (D.hw||[]).filter(h=>h.due_at && new Date(h.due_at)>new Date()).forEach(h=>push({
    key:'hw:'+h.id, kind:'hw', level:1, who:(COURSES[h.course_code]||h.course_code), av:'📝',
    from:'作业', at:h.created_at, title:h.title+' · '+(h.exercises||''),
    body:h.solution_note||'', due:h.due_at, pin:true}));

  FEED=C.filter(c=>(c.body&&c.body.length>1)||c.quote||c.link);
  feedShown=0;
}
/* 权重:基础优先 + 看过衰减 + 久未见回升 + 抖动 */
function feedWeight(c){
  const r=feKey(c.key), now=Date.now();
  let w = c.pin?40 : ({term:1.0,kp:1.2,lec:1.15,en:1.0,read:.9,qa:.8,note:.7,hw:2})[c.kind]||1;
  w *= (c.level===1?1.35:c.level===2?1:.7);
  w /= (1+1.6*r.seen);
  if(r.last){ const days=(now-r.last)/864e5; w *= Math.min(3, .35+days/2); }
  if(r.liked) w*=.45;
  if(r.later) w*=2.2;
  return w*(0.7+Math.random()*0.9);
}
function nextBatch(n){
  const pool=FEED.map(c=>({c,w:feedWeight(c)})).sort((a,b)=>b.w-a.w);
  const out=[]; const used=new Set();
  for(const p of pool){ if(out.length>=n)break; if(used.has(p.c.key))continue; used.add(p.c.key); out.push(p.c); }
  return out;
}
function feedAgo(at){
  if(!at)return'';
  const d=(Date.now()-new Date(at).getTime())/6e4;
  if(d<60)return Math.max(1,Math.floor(d))+'分钟前';
  if(d<1440)return Math.floor(d/60)+'小时前';
  if(d<43200)return Math.floor(d/1440)+'天前';
  return new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,month:'numeric',day:'numeric'}).format(new Date(at));
}
function fcard(c){
  const r=feKey(c.key);
  const tag = c.level===1?'<span class="ftag">基础</span>':c.level===3?'<span class="ftag">推导</span>':'';
  let extra='';
  if(c.quote)   extra+=`<div class="fquote">${esc(c.quote)}</div>`;
  if(c.bookPath)extra+=`<a class="srcbtn" href="javascript:void(0)" onclick="openBook('${esc(c.bookPath)}',${(+c.bookPage)||1})">📖 翻到原文</a>`;
  if(c.link)    extra+=`<a class="srcbtn" target="_blank" href="${esc(c.link)}">打开 ↗</a>`;
  if(c.slug)    extra+=`<a class="srcbtn" href="javascript:void(0)" onclick="openKPslug('${esc(c.slug)}')">看全条 →</a>`;
  if(c.lecId)   extra+=`<a class="srcbtn" href="javascript:void(0)" onclick="openLecture('${esc(c.lecId)}')">整节讲义 →</a>`;
  if(c.due)     extra+=`<div class="muted" style="margin-top:4px">${dueLabel(c.due)}</div>`;
  if(c.quiz && c.body) extra+=`<details class="fquiz"><summary>先自己想一下,再点开看当时的答案</summary>
     <div style="margin-top:6px">${md(c.body)}</div></details>`;
  const bodyHtml = c.quiz ? '' : `<div class="fbody">${md((c.title?('**'+c.title+'** '):'')+c.body)}</div>`;
  return `<div class="fcard" data-k="${esc(c.key)}">
    <div class="fhead"><div class="fav">${c.av}</div>
      <div style="flex:1;min-width:0">
        <div class="fwho">${esc(c.who)}<span class="fv">${c.kind==='hw'?'DDL':'学'}</span></div>
        <div class="fmeta">${feedAgo(c.at)} · 来自 ${esc(c.from)} ${tag}</div>
      </div></div>
    ${c.quiz?`<div class="fbody"><b>${esc(c.title)}</b></div>`:bodyHtml}
    ${extra}
    <div class="fbar">
      <button class="${r.later?'did':''}" onclick="feedAct(this,'${esc(c.key)}','${c.kind}','later')">🔁 稍后再看</button>
      <button onclick="feedAsk('${esc(c.key)}','${esc((c.title||c.who).replace(/'/g,''))}')">💬 提问</button>
      <button class="${r.liked?'did':''}" onclick="feedAct(this,'${esc(c.key)}','${c.kind}','like')">👍 会了</button>
    </div></div>`;
}
function rFeed(){
  const today=todayStr();
  const seenToday=(D.fe||[]).filter(e=>e.action==='seen'&&dayOf(e.at)===today).length;
  const days=new Set((D.fe||[]).map(e=>dayOf(e.at))); let streak=0;
  for(let i=0;;i++){ const d=new Date(Date.now()-i*864e5);
    const k=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
    if(days.has(k))streak++; else if(i>0)break; else break; }
  const first=nextBatch(feedBatch); feedShown=first.length;
  setTimeout(feedObserve,0);
  return `<div class="fstat"><span>今天刷了 <b>${seenToday}</b> 条</span>
      <span>连着 <b>${streak}</b> 天</span>
      <span>池子里 <b>${FEED.length}</b> 条</span>
      <span style="flex:1"></span>
      <button class="iconbtn" onclick="reshuffle()">换一换</button></div>
    <div id="feedlist">${first.map(fcard).join('')}</div>
    <div class="fend" id="feedmore">往下拉,还有…</div>`;
}
function reshuffle(){ render(); window.scrollTo({top:0,behavior:'smooth'}); }
async function feedAct(btn,key,kind,action){
  btn.classList.toggle('did');
  const r=feKey(key); if(action==='like')r.liked=!r.liked; if(action==='later')r.later=!r.later;
  await sb.from('feed_events').insert({card_key:key,kind:kind,action:action});
  toast(action==='like'?'记下了:这条你会了':'加到稍后再看');
}
function feedAsk(key,label){
  openOv(`<h3>就这条提问</h3><div class="muted" style="margin-bottom:8px">${esc(label)}</div>
    <textarea id="fq" rows="4" placeholder="写下你的疑问,下次窗口会看到"></textarea>
    <button class="btn" onclick="feedAskGo('${esc(key)}')">记下</button>`);
}
async function feedAskGo(key){
  const t=(document.getElementById('fq').value||'').trim(); if(!t)return;

/* 无限流:滚到底自动续 */
let feedIO=null;
function feedObserve(){
  const more=document.getElementById('feedmore'); if(!more)return;
  if(feedIO)feedIO.disconnect();
  feedIO=new IntersectionObserver(es=>{
    if(!es[0].isIntersecting)return;
    const list=document.getElementById('feedlist'); if(!list)return;
    const shownKeys=new Set([...list.children].map(x=>x.dataset.k));
    const more2=FEED.map(c=>({c,w:feedWeight(c)})).filter(p=>!shownKeys.has(p.c.key))
                    .sort((a,b)=>b.w-a.w).slice(0,feedBatch).map(p=>p.c);
    if(!more2.length){ document.getElementById('feedmore').textContent='今天的池子见底了 —— 去别的页看看,或者明天再来'; feedIO.disconnect(); return; }
    list.insertAdjacentHTML('beforeend',more2.map(fcard).join(''));
    mathify(list);
    markSeen(more2);
  },{rootMargin:'400px'});
  feedIO.observe(more);
  markSeen([...document.querySelectorAll('#feedlist .fcard')].map(x=>({key:x.dataset.k,kind:'?'})));
}
let seenQueue=[], seenTimer=null;
function markSeen(cards){
  cards.forEach(c=>{ const k=c.key||c; feKey(k).seen++; seenQueue.push({card_key:k,kind:c.kind||'card',action:'seen'}); });
  clearTimeout(seenTimer);
  seenTimer=setTimeout(async()=>{ const q=seenQueue.splice(0); if(!q.length||!sb)return;
    await sb.from('feed_events').insert(q); },1500);
}

/* ---------- 作业 ---------- */
function dueLabel(iso){
  if(!iso)return '<span class="muted">无截止日期</span>';
  const d=new Date(iso), now=new Date();
  const txt=new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  const hrs=(d-now)/36e5;
  if(hrs<0)   return `<span class="muted">已截止 · ${txt}</span>`;
  if(hrs<48)  return `<b style="color:var(--accent)">${txt} 截止 · 剩 ${Math.floor(hrs)} 小时</b>`;
  return `${txt} 截止 · 剩 ${Math.ceil(hrs/24)} 天`;
}
function rHW(){
  const hs=D.hw||[];
  if(!hs.length)return '<p class="muted">还没有作业记录。</p>';
  return hs.map(h=>{
    const btns=[];
    if(h.spec_path)     btns.push(`<a class="srcbtn" href="javascript:void(0)" onclick="openPrivate('${esc(h.spec_path)}')">题面 🔒</a>`);
    if(h.solution_path) btns.push(`<a class="srcbtn" href="javascript:void(0)" onclick="openPrivate('${esc(h.solution_path)}')">详细解答 🔒</a>`);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
        <b>${esc(COURSES[h.course_code]||h.course_code)} · ${esc(h.title||('HW'+h.hw_no))}</b>
        <span style="font-size:13px">${dueLabel(h.due_at)}</span></div>
      <div style="margin:4px 0 6px">${esc(h.exercises||'')}</div>
      ${h.solution_note?`<div class="muted" style="font-size:13px;margin-bottom:6px">${esc(h.solution_note)}</div>`:''}
      <div>${btns.join(' ')}</div></div>`;
  }).join('');
}

function qaCard(q){
  return `<div style="border-left:3px solid var(--accent);background:var(--well);border-radius:0 9px 9px 0;
      padding:8px 12px;margin:10px 0;cursor:pointer" onclick="closeOv();openQA('${q.id}')">
    <div style="font-size:12px;color:var(--accent)">你在这里问过 · ${dayOf(q.asked_at)}</div>
    <div style="font-size:13.5px;margin-top:2px">${esc(q.question)}</div></div>`;
}
// 把挂在本节课的问答按 anchor 插到对应小节末尾;没有 anchor 或匹配不上的收在最后
function lectureBody(l){
  let html = md(l.summary_md) || '<p class="empty">暂无讲义</p>';
  const qs = D.qa.filter(q=>q.lecture_id===l.id);
  const rest = [];
  qs.forEach(q=>{
    if(!q.anchor){rest.push(q);return;}
    const key = q.anchor.replace(/\s/g,'');
    // 找到标题文本包含 anchor 的那个 <hN>,插到下一个 <hN> 之前(即该节末尾)
    const re = /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/g;
    let m, start=-1, end=html.length;
    while((m = re.exec(html))!==null){
      const txt = m[1].replace(/<[^>]*>/g,'').replace(/\s/g,'');
      if(start<0 && txt.includes(key)){ start = m.index; }
      else if(start>=0){ end = m.index; break; }
    }
    if(start<0){rest.push(q);return;}
    html = html.slice(0,end) + qaCard(q) + html.slice(end);
  });
  if(rest.length) html += `<div style="margin-top:12px"><b style="font-size:13.5px">读这节笔记时的问题与反思</b>`
    + rest.map(qaCard).join('') + `</div>`;
  return html;
}
function openLecture(id){
  const l=D.lec.find(x=>x.id===id);if(!l)return;
  openOv(`<h3>${esc(COURSES[l.course_code]||l.course_code)} · ${l.lecture_date}</h3>
    <div class="muted">${esc(l.title||'')}</div>

function rMap(list){
  // 主题思维导图:无主题筛选时画主题总览,选了主题画该主题的条目图;边 = 正文 [[slug]] 引用
  if(!kbTopic){
    const groups={};
    list.forEach(k=>{const t=k.topic||'未分类';(groups[t]=groups[t]||[]).push(k);});
    const names=Object.keys(groups).sort();
    return svgRadial('统计知识库',names.map(t=>({label:t+' ('+groups[t].length+')',
      onclick:`kbTopic='${t}';render()`})),[]);
  }
  if(!list.length)return'<div class="empty">空</div>';
  const idx={};list.forEach((k,i)=>idx[k.slug]=i);
  const edges=[];
  list.forEach((a,i)=>{const m=(a.body_md||'').match(/\[\[([a-z0-9-]+)\]\]/g)||[];
    m.forEach(x=>{const s=x.slice(2,-2);if(s in idx&&idx[s]!==i)edges.push([i,idx[s]]);});});
  return svgRadial(kbTopic,list.map(k=>({label:(k.title_zh||k.title_en).slice(0,10),
    onclick:`openKP('${k.id}')`,dim:k.status==='stub'})),edges);
}
function svgRadial(center,nodes,edges){
  const N=nodes.length;if(!N)return'<div class="empty">空</div>';
  const R=Math.max(120,N*22),cx=R+110,cy=R+40,W=2*cx,H=2*cy-20;
  const pos=nodes.map((_,i)=>{const a=i*2*Math.PI/N-Math.PI/2;
    return [cx+R*Math.cos(a),cy+R*Math.sin(a),a];});
  let s=`<div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,720)}px;width:100%">`;
  s+=pos.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="1"/>`).join('');
  s+=edges.map(([i,j])=>`<line x1="${pos[i][0]}" y1="${pos[i][1]}" x2="${pos[j][0]}" y2="${pos[j][1]}" stroke="var(--accent)" stroke-width="1.3" opacity="0.55"/>`).join('');
  s+=`<circle cx="${cx}" cy="${cy}" r="34" fill="var(--accent)"/><text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#fff" font-size="12">${esc(center).slice(0,12)}</text>`;
  s+=nodes.map((n,i)=>{const [x,y,a]=pos[i];const right=Math.cos(a)>=0;
    return `<g style="cursor:pointer" onclick="${n.onclick}">
      <circle cx="${x}" cy="${y}" r="7" fill="${n.dim?'var(--faint)':'var(--accent)'}"/>
      <text x="${x+(right?11:-11)}" y="${y+4}" text-anchor="${right?'start':'end'}" fill="var(--ink)" font-size="12.5">${esc(n.label)}</text></g>`;}).join('');
  return s+`</svg></div><div class="muted" style="margin-top:6px">紫线 = 条目间引用;点节点打开${kbTopic?';<a href="javascript:void(0)" onclick="kbTopic=\'\';render()">← 回主题总览</a>':''}</div>`;
}

    <div class="muted">${dayOf(q.asked_at)} · ${esc(q.window_name||'')}</div>
    ${(q.my_thought_en||q.my_thought)?`<details class="kps" open style="margin-top:10px">
      <summary>我当时是怎么想的${q.my_thought_en&&q.my_thought?' (原文 / 中文)':''}</summary>
      ${q.my_thought_en?`<div class="md" style="background:var(--well);border-radius:9px;padding:8px 12px;margin-top:6px">${md(q.my_thought_en)}</div>`:''}
      ${q.my_thought?`<div class="md" style="background:var(--well);border-radius:9px;padding:8px 12px;margin-top:6px">${md(q.my_thought)}</div>`:''}
      </details>`:''}
    <div class="md kp-body">${q.answer_md?md(q.answer_md):'<p class="empty">答案还没归档。</p>'}</div>
    ${kps?`<div style="margin-top:10px"><span class="muted">相关知识点:</span> ${kps}</div>`:''}`);
}

/* ---------- overlay / add ---------- */
function openOv(html){
  document.getElementById('sheet').innerHTML=html+
    `<div style="text-align:right;margin-top:14px"><button class="btn ghost" onclick="closeOv()">关闭</button></div>`;
  document.getElementById('ov').classList.add('on');
  mathify(document.getElementById('sheet'));
}
function closeOv(){document.getElementById('ov').classList.remove('on');}
let addType='study';
function openAdd(){
  const seg=(t,zh)=>`<button class="${addType===t?'on':''}" onclick="addType='${t}';openAdd()">${zh}</button>`;
  let fields='';
  if(addType==='study')fields=`<label>今天学到/遇到了什么</label><textarea id="a1" placeholder="一句话"></textarea>
    <label>分类(可空)</label><input id="a2" placeholder="course / self / paper …">
    <label>链接(可空)</label><input id="a3">`;
  if(addType==='kp')fields=`<label>标题(英文)</label><input id="a1" placeholder="empirical Bayes">
    <label>标题(中文,可空)</label><input id="a2">
    <label>为什么想记 / 哪里不懂(可空)</label><textarea id="a3"></textarea>`;
  if(addType==='read')fields=`<label>标题</label><input id="a1">
    <label>链接(可空)</label><input id="a2">
    <label>谁推荐的(可空)</label><input id="a3">`;
  if(addType==='qa')fields=`<label>问题</label><textarea id="a1" placeholder="我想知道…"></textarea>
    <label>主题(可空)</label><input id="a2">`;
  openOv(`<h3>记一条</h3>
    <div class="seg" style="margin:10px 0">${seg('study','学到')}${seg('kp','知识点')}${seg('read','想读')}${seg('qa','提问')}</div>
    ${fields}<div style="margin-top:14px"><button class="btn" onclick="saveAdd()">保存</button></div>`);
}
async function saveAdd(){
  const v=i=>document.getElementById('a'+i)?.value?.trim()||null;
  let r={};
  try{
    if(addType==='study')r=await sb.from('study_log').insert({takeaway:v(1),category:v(2),link:v(3),source:'web',study_on:todayStr()});
    if(addType==='kp')r=await sb.from('knowledge_points').insert({slug:(v(1)||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
      title_en:v(1),title_zh:v(2),body_md:null,status:'stub',origin:'manual',topic:null,kind:'concept',
      sources:v(3)?[{label:'她的疑问',url:'',locator:v(3)}]:[]});
    if(addType==='read')r=await sb.from('reading_queue').insert({title:v(1),link:v(2),recommender:v(3)||'自查'});
    if(addType==='qa')r=await sb.from('qa_log').insert({question:v(1),topic:v(2),window_name:'web'});
  }catch(e){return toast('失败: '+e.message)}
  if(r.error)return toast('失败: '+r.error.message);
  closeOv();toast('已记下,我这边会跟进');loadAll();
}
boot();
</script>
