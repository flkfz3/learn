<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --accent:#6d5dfc; --accent-2:#5a4ae0; --accent-soft:#eceafe;
  --ink:#26244d; --muted:#5c5a80; --faint:#8886a8; --line:#e4e2f2;
  --card:#ffffff; --field:#ffffff; --well:#f2f0fb; --page:#f7f6fd;
  --glow:radial-gradient(40rem 30rem at 8% 0%,rgba(150,135,255,.20),transparent 60%),
         radial-gradient(38rem 30rem at 95% 12%,rgba(109,93,252,.12),transparent 60%);
  --ok:#0a7f5a; --warn:#b45309; --danger:#c62828;
  --chip-term:#0369a1; --chip-concept:#6d5dfc; --chip-theorem:#0a7f5a;
  --chip-trap:#c62828; --chip-method:#b45309;
  --sh:0 8px 26px rgba(38,36,77,.08); --r:14px;
}
html[data-theme=dark]{
  --accent:#8f83ff; --accent-2:#a89eff; --accent-soft:rgba(143,131,255,.18);
  --ink:#e8e6f7; --muted:#b3b0d0; --faint:#8a87ad; --line:#33315a;
  --card:#1d1b38; --field:#171530; --well:#252245; --page:#12102a;
  --glow:radial-gradient(40rem 34rem at 10% 10%,rgba(90,74,224,.30),transparent 60%),
         radial-gradient(38rem 32rem at 90% 90%,rgba(56,40,180,.25),transparent 62%);
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
  --chip-term:#7dd3fc; --chip-concept:#a89eff; --chip-theorem:#34d399;
  --chip-trap:#f87171; --chip-method:#fbbf24;
  --sh:0 10px 30px rgba(0,0,10,.45);
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
  background:var(--page);background-image:var(--glow);background-attachment:fixed;
  color:var(--ink);min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;gap:10px;padding:10px 2px}
header h1{font-size:20px;letter-spacing:.5px}
header .build{font-size:11px;color:var(--faint)}
header .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:10px;padding:5px 10px;cursor:pointer;font-size:13px}

/* ---------- 刷:照着微博做 ---------- */
:root{ --wb-org:#ff8200; --wb-name:#eb7350; --wb-meta:#939393; --wb-bg:#f2f2f5;
       --wb-card:#fff; --wb-line:#f0f0f0; --wb-txt:#333; --wb-blue:#3c8ee6; }
html[data-theme=dark]{ --wb-org:#ff9a33; --wb-name:#ff9f7a; --wb-meta:#8f8caa;
       --wb-bg:#15132e; --wb-card:#1d1b38; --wb-line:#2c2a52; --wb-txt:#e8e6f7; --wb-blue:#6fb0ef; }

.wb{background:var(--wb-bg);margin:-4px -14px 0;padding:10px 12px 40px;color:var(--wb-txt);
    font-size:14px;line-height:1.6}
.wbgrid{display:grid;grid-template-columns:150px minmax(0,1fr) 250px;gap:12px;
    max-width:1180px;margin:0 auto;align-items:start}
@media(max-width:1000px){ .wbgrid{grid-template-columns:minmax(0,1fr)} .wbside{display:none} }
.wbbox{background:var(--wb-card);border-radius:6px;padding:10px 12px;margin-bottom:10px;
    border:1px solid var(--wb-line)}
.wbbox h4{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.wbbox h4 .more{margin-left:auto;font-size:12px;color:var(--wb-org);cursor:pointer;font-weight:400}
.wbnav a{display:block;padding:7px 8px;border-radius:4px;color:var(--wb-txt);cursor:pointer;
    font-size:14px;text-decoration:none}
.wbnav a:hover{background:var(--wb-bg)}
.wbnav a.on{color:var(--wb-org);font-weight:600}
.wbnav a .c{float:right;color:var(--wb-meta);font-size:12px;font-weight:400}
.wbpost{background:var(--wb-card);border:1px solid var(--wb-line);border-radius:6px;
    padding:12px 14px 0;margin-bottom:10px}
.wbtop{display:flex;gap:10px}
.wbav{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:19px;background:linear-gradient(135deg,#ffd9b0,#ffb066);
    color:#7a4a12;font-weight:700;border:1px solid var(--wb-line)}
html[data-theme=dark] .wbav{background:linear-gradient(135deg,#4a3f7a,#6b5aa8);color:#ffe6c9}
.wbname{color:var(--wb-name);font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.wbbadge{font-size:10px;background:var(--wb-org);color:#fff;border-radius:3px;padding:0 3px;line-height:14px}
.wbfrom{color:var(--wb-meta);font-size:12px;margin-top:2px}
.wbfrom b{color:var(--wb-blue);font-weight:400}
.wbtext{margin:8px 0 6px;font-size:14.5px;line-height:1.72;word-break:break-word}
.wbtext p{margin:.3em 0}
.wbtext .tt{font-weight:600}
.wbtopic{color:var(--wb-blue)}
.wbquote{background:var(--wb-bg);border-radius:4px;padding:8px 10px;margin:6px 0;font-size:13.5px;
    color:var(--wb-txt)}
.wbacts{display:flex;border-top:1px solid var(--wb-line);margin-top:8px}
.wbacts button{flex:1;border:0;background:none;color:var(--wb-meta);font-size:13px;padding:9px 0;
    cursor:pointer;position:relative}
.wbacts button+button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;
    width:1px;background:var(--wb-line)}
.wbacts button:hover{color:var(--wb-org)}
.wbacts button.on{color:var(--wb-org);font-weight:600}
.wbchip{display:inline-block;font-size:11px;padding:0 6px;border-radius:2px;line-height:17px;
    background:#fff1e5;color:#e2691b;margin-left:6px}
html[data-theme=dark] .wbchip{background:#3a2c1c;color:#ffb066}
.wbhot li{list-style:none;display:flex;gap:8px;padding:5px 0;font-size:13.5px;cursor:pointer}
.wbhot li:hover{color:var(--wb-org)}
.wbhot .r{width:16px;text-align:center;color:var(--wb-meta);font-weight:700}
.wbhot .r1{color:#ff2d2d}.wbhot .r2{color:#ff6a00}.wbhot .r3{color:#ffa600}
.wbhot .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbhot .f{font-size:10px;color:#fff;background:#ff2d2d;border-radius:2px;padding:0 3px;align-self:center}
.wbstat{display:flex;text-align:center}
.wbstat div{flex:1}
.wbstat b{display:block;font-size:17px;color:var(--wb-txt)}
.wbstat span{font-size:11px;color:var(--wb-meta)}
.wbcompose textarea{width:100%;border:1px solid var(--wb-line);border-radius:4px;background:var(--wb-bg);
    color:var(--wb-txt);padding:8px 10px;font-size:14px;resize:vertical;font-family:inherit}
.wbsend{background:var(--wb-org);color:#fff;border:0;border-radius:4px;padding:6px 18px;
    font-size:13px;cursor:pointer;float:right;margin-top:8px}
.wbend{text-align:center;color:var(--wb-meta);font-size:13px;padding:16px 0}
.wbquiz{background:var(--wb-bg);border-radius:4px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.wbquiz summary{cursor:pointer;color:var(--wb-org);font-weight:600}
.wblink{color:var(--wb-blue);font-size:13px;margin-right:12px;cursor:pointer}
/* 手机版:整页当成微博 App —— 顶栏 + 流 + 底部四个 tab */
.wbbar{position:sticky;top:0;z-index:20;background:var(--wb-card);border-bottom:1px solid var(--wb-line);
  display:flex;align-items:center;gap:12px;padding:8px 12px;margin:0 -12px 10px}
.wbbar .me{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffd9b0,#ffb066);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#7a4a12;font-weight:700}
.wbbar .tabs{flex:1;display:flex;gap:18px;justify-content:center}
.wbbar .tabs span{font-size:17px;color:var(--wb-meta);cursor:pointer;padding-bottom:3px}
.wbbar .tabs span.on{color:var(--wb-txt);font-weight:700;border-bottom:3px solid #ff5a5f}
.wbbar .ic{font-size:17px;color:var(--wb-txt);cursor:pointer;background:none;border:0}
.wbtabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--wb-card);
  border-top:1px solid var(--wb-line);display:flex;padding:6px 0 8px}
.wbtabbar button{flex:1;border:0;background:none;color:var(--wb-meta);font-size:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.wbtabbar button b{font-size:18px;font-weight:400;line-height:1}
.wbtabbar button.on{color:var(--wb-org)}
@media(min-width:1001px){ .wbtabbar{display:none} .wbbar{margin-bottom:12px} }
@media(max-width:1000px){ .wb{padding-bottom:70px} }
/* 微博手机版的动作条是四个图标,不是三个文字按钮 */
.wbicons{display:flex;border-top:1px solid var(--wb-line);margin-top:8px}
.wbicons button{flex:1;border:0;background:none;color:var(--wb-meta);font-size:13px;padding:10px 0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.wbicons button:hover{color:var(--wb-org)}
.wbicons button.on{color:var(--wb-org)}
.wbicons .n{font-size:12px}
.wbmore{position:absolute;right:12px;top:12px;color:var(--wb-meta);font-size:13px;cursor:pointer}
.wbpost{position:relative}
.wbtrans{color:var(--wb-meta);font-size:13px;cursor:pointer;margin-bottom:2px;display:inline-block}

nav{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:4px 0 16px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--muted);font-size:15px;padding:9px 13px;
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .n{font-size:12px;color:var(--faint);font-weight:400}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;
  border:1px solid currentColor;vertical-align:1px}
.k-term{color:var(--chip-term)}.k-concept{color:var(--chip-concept)}
.k-theorem{color:var(--chip-theorem)}.k-trap{color:var(--chip-trap)}.k-method{color:var(--chip-method)}
.st-stub{color:var(--warn)}.st-draft{color:var(--chip-term)}.st-done{color:var(--ok)}
.srcbtn{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--line);
  background:var(--well);border-radius:8px;padding:2px 9px;margin:2px 4px 2px 0;text-decoration:none}
.row{padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{font-size:14.5px}
.row .m{font-size:12px;color:var(--faint)}
.md{font-size:14.5px}
.md p{margin:.5em 0}.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md h1,.md h2,.md h3{font-size:1.05em;margin:.8em 0 .3em}
.md code{background:var(--well);padding:1px 5px;border-radius:5px;font-size:.92em}
.md pre{background:var(--well);padding:10px;border-radius:9px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--muted);margin:.5em 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:3px 9px;font-size:13.5px}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--faint);font-size:13px;padding:8px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label{font-size:12.5px;color:var(--muted);display:block;margin:9px 0 3px}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-size:14px;
  border-radius:10px;padding:8px 18px;cursor:pointer}
.btn.ghost{background:var(--well);color:var(--ink);border:1px solid var(--line)}
.btn.mini{font-size:12px;padding:3px 10px;border-radius:8px}
.fab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:26px;border:0;cursor:pointer;
  box-shadow:0 8px 22px rgba(109,93,252,.45)}
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.45);display:none;
  align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow-y:auto}
.overlay.on{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:760px;width:100%;
  padding:20px 22px;box-shadow:var(--sh);margin-bottom:6vh}
.sheet h3{font-size:17px;margin-bottom:4px}
.toolrow{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.toolrow input[type=date]{width:auto}
.toolrow input[type=search]{flex:1;min-width:140px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:6px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.stars{color:var(--warn);letter-spacing:1px}
.login{max-width:360px;margin:16vh auto;text-align:center}
.login .card{padding:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);
  color:var(--page);padding:8px 18px;border-radius:99px;font-size:13.5px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.kp-body{margin-top:8px}
details.kps{margin-top:6px}
details.kps summary{cursor:pointer;font-size:13px;color:var(--accent)}
.kpitem{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kpitem:last-child{border-bottom:0}
@media (max-width:560px){.wrap{padding:8px 8px 90px}.card{padding:12px}}
</style>
</head>
<body>
<div id="login" class="login" style="display:none">
  <div class="card">
    <h1 style="margin-bottom:6px">learn · 学习台</h1>
    <p class="muted" style="margin-bottom:14px">用邮箱魔法链接登录</p>
    <input id="email" type="email" placeholder="email">
    <button class="btn" style="margin-top:12px;width:100%" onclick="sendLink()">发送登录链接</button>
    <p id="loginmsg" class="muted" style="margin-top:10px"></p>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <header>

/* ---------- 刷:信息流(参考微博的三段式卡片) ----------
   设计意图,改之前先读:
   1) 碎片化:知识点正文按 ## 小节切开,一张卡只承载一个小节;术语/英语/问答本身就是原子。
   2) 从最基础开始:每张卡有 level(1 基础 / 2 展开 / 3 推导),没标记过"会了"的主题优先给 level 1。
   3) 接触效应:看过的卡权重按 1/(1+看过次数) 衰减但不归零,隔得越久权重回升——本质是伪装成信息流的间隔重复。
   4) 旧习惯:头像+博主名+"几小时前 来自X"+底部三键,布局照搬微博,肌肉记忆直接迁移。
   5) 不确定性:每批抽样带随机抖动,顺序不可预测;偶尔插入回音卡/小测验卡。
   来源必须一眼可见——"博主名"就是来源,这条与知识库的溯源铁律一致。            */
let FEED=[], feedShown=0, feedSeen={}, feedBatch=12;

/* 同一天内稳定的哈希:让"哪张变成测验"每天换一批,但当天刷两次结果一致 */
function hashDay(str){
  const d=todayStr(); let h=0; const t=str+d;
  for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))|0; }
  return Math.abs(h);
}
function feKey(k){ return feedSeen[k] || (feedSeen[k]={seen:0,liked:false,later:false,last:0}); }

/* 截断必须在段落边界,且不能把 $...$ 切成单数——切坏了 KaTeX 会整块渲染失败 */
function clipMD(t,limit){
  const paras=(t||'').split(/\n\s*\n/);
  let out='';
  for(const q of paras){
    const next = out? out+'\n\n'+q : q;
    if(next.length>limit && out) break;
    out=next;
    if(out.length>limit) break;
  }
  if((out.match(/\$/g)||[]).length % 2) out=out.replace(/\$[^$]*$/,'');
  return out.length<(t||'').length ? out.trim()+'\n\n…' : out.trim();
}
function mdFirstPara(t){
  const s=(t||'').split(/\n\s*\n/).find(x=>x.trim() && !x.trim().startsWith('#'))||'';
  return clipMD(s,420);
}
/* 把讲义级正文切成小节卡 */
function splitSections(body){
  const out=[]; if(!body)return out;
  const parts=body.split(/\n(?=##\s)/);
  parts.forEach((sec,i)=>{
    const m=sec.match(/^##\s*(.+)/);
    const title=m?m[1].trim():'';
    const text=(m?sec.slice(m[0].length):sec).trim();
    if(text.length>40) out.push({title,text:clipMD(text,620),i});
  });
  return out;
}
/* ===== 内容层:按"社交媒体为什么上瘾"的机制重做 =====
   1 变比率强化:大多数帖平淡,少数是真·爽点(词源八卦/老师金句/反直觉事实),随机出现。
   2 单位成本极低:一条帖 = 一句话,2 秒读完;长内容折成「全文」,不把阅读任务塞进流里。
   3 好奇缺口:标题写成"钩子"而不是"小节名"——大脑要闭合这个循环才肯往下滑。
   4 自我相关:「过去的你」问过的问题、你标过会了的东西,是最强的停留点。
   5 人格化:每个来源是一个有固定语气的"博主",不是一个数据库表名。
   6 形式多样:一句话/投票/转发/翻车预警/回音/对比,像微博有图有转发有投票。      */
const PERSONA={
  m8170:{n:'测度论老师',a:'测',v:1},
  m8060:{n:'计算课代表',a:'算',v:1},
  term :{n:'术语君',    a:'术',v:0},
  en   :{n:'单词精',    a:'词',v:0},
  paper:{n:'论文墙',    a:'读',v:1},
  past :{n:'过去的你',  a:'你',v:0},
  ddl  :{n:'DDL 提醒姬',a:'急',v:1},
  trap :{n:'翻车预警',  a:'坑',v:0},
  note :{n:'随手记',    a:'记',v:0},
};
function personaFor(courseCode){ return courseCode==='STAT8170'?PERSONA.m8170:PERSONA.m8060; }
function oneSentence(t,limit){
  t=(t||'').replace(/\*\*/g,'').replace(/\n+/g,' ').trim();
  const m=t.match(/^[\s\S]{10,}?[。;;!?!?]/);
  let out=m?m[0]:t;
  if(out.length>limit) out=out.slice(0,limit)+'…';
  if((out.match(/\$/g)||[]).length%2) out=out.replace(/\$[^$]*$/,'');
  return out.trim();
}
/* 从正文里挖"常见错 / 坑 / 注意"这类小节,拆成一条一条的翻车预警 */
function trapItems(body){
  if(!body)return [];
  const out=[];
  const sec=body.split(/\n(?=##\s)/).find(x=>/^##\s*(常见错|坑|注意|易错)/.test(x));
  if(!sec)return out;
  sec.split('\n').forEach(l=>{
    const m=l.match(/^[-*]\s+(.+)/);
    if(m && m[1].length>12) out.push(m[1].replace(/\*\*/g,'').trim());
  });
  return out;
}
function buildFeed(){
  buildFeedSeen();
  const C=[]; const push=o=>C.push(o);

  /* ---- 一句话帖:每个知识点的定调句,读完 2 秒 ---- */
  D.kp.filter(k=>k.kind!=='term').forEach(k=>{
    const one=(k.body_md||'').match(/\*\*一句话[:：]\*\*\s*([\s\S]*?)(?:\n\n|$)/);
    const per=k.origin==='course'?PERSONA.m8170:PERSONA.term;
    if(one) push({key:'kp1:'+k.slug, kind:'kp', level:1, per, at:k.updated_at,
      from:k.title_zh||k.slug, head:k.title_zh||k.slug,
      text:oneSentence(one[1],110), full:one[1], slug:k.slug});
    /* ---- 翻车预警:把"常见错"拆成一条一条 ---- */
    trapItems(k.body_md).forEach((t,i)=>push({
      key:'trap:'+k.slug+':'+i, kind:'kp', level:2, per:PERSONA.trap, at:k.updated_at,
      from:k.title_zh||k.slug, head:'这里很多人栽过',
      text:oneSentence(t,120), full:t, slug:k.slug, hot:1}));
    /* ---- 展开帖:小节标题当钩子,正文折起来 ---- */
    splitSections(k.body_md).forEach(sec=>{
      if(!sec.title)return;
      push({key:'kp:'+k.slug+':'+sec.i, kind:'kp',
        level:(/证明|推导|proof/i.test(sec.title)?3:2), per:PERSONA.term, at:k.updated_at,
        from:k.title_zh||k.slug, head:sec.title,
        text:oneSentence(sec.text,100), full:sec.text, slug:k.slug});
    });
  });

  /* ---- 课堂要点:老师人格 + 要点一句话 ---- */
  D.lec.forEach(l=>(l.key_points||[]).forEach((kp,i)=>push({
    key:'lkp:'+l.id+':'+i, kind:'lec', level:kp.importance>=3?2:1,
    per:personaFor(l.course_code), at:l.lecture_date+'T12:00:00Z',
    from:(COURSES[l.course_code]||l.course_code)+' '+l.lecture_date.slice(5),
    head:kp.title_zh||kp.title_en||'', text:oneSentence(kp.summary_zh,120),
    full:kp.summary_zh, lecId:l.id, hot:kp.importance>=3?1:0})));

  /* ---- 术语:一句话解释,四分之一变成投票式测验 ---- */
  D.kp.filter(k=>k.kind==='term').forEach(k=>{
    const quiz = k.title_en && k.title_zh && (hashDay(k.slug)%4===0);
    push({key:'term:'+k.slug, kind:'term', level:1, per:PERSONA.term, at:k.updated_at,
      from:'术语', head: quiz? ('“'+k.title_zh+'”英文怎么说?') : (k.title_en+' · '+k.title_zh),
      text: quiz? '' : oneSentence(k.body_md,100),
      full: quiz? ('**'+k.title_en+'**\n\n'+(mdFirstPara(k.body_md)||'')) : k.body_md,
      quiz, slug:k.slug});
  });

  /* ---- 单词精:有词源/钩子的才发,这类是"爽点" ---- */
  (D.en||[]).forEach(e=>{
    const hook=(e.note_md||'').match(/词源|来自|同源|词根|原意/) ? e.note_md : '';
    push({key:'en:'+e.id, kind:'en', level:1, per:PERSONA.en, at:e.asked_at,
      from:e.kind||'word', head:e.term,
      text:oneSentence(hook||e.meaning_zh,110), full:e.note_md||e.meaning_zh,
      quote:e.context||'', bookPath:e.source_path, bookPage:e.source_page,
      hot:hook?1:0});
  });

  /* ---- 论文墙:转发式(引文块放摘要) ---- */
  (D.rq||[]).filter(r=>r.status!=='done').forEach(r=>push({
    key:'read:'+r.id, kind:'read', level:1, per:PERSONA.paper, at:r.created_at,
    from:r.recommender||'待读', head:'有人推荐你读这篇',
    text:oneSentence(r.title,90), quote:oneSentence(r.note,140), full:r.note,
    link:r.link}));

  /* ---- 过去的你:自我相关,最强停留点 ---- */
  (D.qa||[]).forEach(q=>push({
    key:'qa:'+q.id, kind:'qa', level:1, per:PERSONA.past, at:q.asked_at,
    from:(q.window_name||'')+'窗口', head:'你问过这个',
    text:oneSentence(q.question,110), full:q.answer_md, quiz:!!q.answer_md}));

  (D.sl||[]).forEach(t=>push({
    key:'sl:'+t.id, kind:'note', level:1, per:PERSONA.note, at:t.study_on,
    from:t.category||'笔记', head:'', text:oneSentence(t.takeaway,120),
    full:t.takeaway, link:t.link}));

  (D.hw||[]).filter(h=>h.due_at && new Date(h.due_at)>new Date()).forEach(h=>push({
    key:'hw:'+h.id, kind:'hw', level:1, per:PERSONA.ddl, at:h.created_at,
    from:(COURSES[h.course_code]||h.course_code),
    head:h.title+' · '+(h.exercises||''), text:'', due:h.due_at, pin:true}));

  FEED=C.filter(c=>(c.text&&c.text.length>1)||c.quiz||c.due);
  feedShown=0;
}
/* 权重:基础优先 + 看过衰减 + 久未见回升 + 抖动 */
function feedWeight(c){
  const r=feKey(c.key), now=Date.now();
  let w = c.pin?40 : ({term:1.0,kp:1.2,lec:1.15,en:1.0,read:.9,qa:.8,note:.7,hw:2})[c.kind]||1;
  w *= (c.level===1?1.35:c.level===2?1:.7);
  w /= (1+1.6*r.seen);
  if(r.last){ const days=(now-r.last)/864e5; w *= Math.min(3, .35+days/2); }
  if(r.liked) w*=.45;
  if(r.later) w*=2.2;
  if(c.hot) w*=1.5;                    // 词源八卦/翻车预警/老师强调的点 = 变比率里的"中奖"
  return w*(0.7+Math.random()*0.9);
}
function nextBatch(n){
  const src=(typeof feedGroup!=='undefined'&&feedGroup!=='all')?FEED.filter(c=>c.kind===feedGroup):FEED;
  const pool=src.map(c=>({c,w:feedWeight(c)})).sort((a,b)=>b.w-a.w);
  const out=[]; const used=new Set();
  for(const p of pool){ if(out.length>=n)break; if(used.has(p.c.key))continue; used.add(p.c.key); out.push(p.c); }
  return out;
}
function feedAgo(at){
  if(!at)return'';
  const d=(Date.now()-new Date(at).getTime())/6e4;
  if(d<60)return Math.max(1,Math.floor(d))+'分钟前';
  if(d<1440)return Math.floor(d/60)+'小时前';
  if(d<43200)return Math.floor(d/1440)+'天前';
  return new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,month:'numeric',day:'numeric'}).format(new Date(at));
}
function fcard(c){
  const r=feKey(c.key), per=c.per||{n:'学习',a:'学',v:0};
  const chip = c.hot?'<span class="wbchip">🔥</span>':(c.level===1?'<span class="wbchip">基础</span>':c.level===3?'<span class="wbchip">推导</span>':'');
  let links='';
  if(c.bookPath)links+=`<span class="wblink" onclick="openBook('${esc(c.bookPath)}',${(+c.bookPage)||1})">翻到原文</span>`;
  if(c.link)    links+=`<a class="wblink" target="_blank" href="${esc(c.link)}">打开原文</a>`;
  if(c.slug)    links+=`<span class="wblink" onclick="openKPslug('${esc(c.slug)}')">进主页</span>`;
  if(c.lecId)   links+=`<span class="wblink" onclick="openLecture('${esc(c.lecId)}')">整节讲义</span>`;

  // 正文 = 钩子一行 + 一句话;长内容折进「全文」,不把阅读任务塞进流里
  let body=`<div class="wbtext">`;
  if(c.head) body+=`<span class="tt">${esc(c.head)}</span>${c.text?' ':''}`;
  if(c.text) body+=md(c.text).replace(/^<p>|<\/p>$/g,'');

/* 无限流:滚到底自动续 */
let feedIO=null;
function feedObserve(){
  const more=document.getElementById('feedmore'); if(!more)return;
  if(feedIO)feedIO.disconnect();
  feedIO=new IntersectionObserver(es=>{
    if(!es[0].isIntersecting)return;
    const list=document.getElementById('feedlist'); if(!list)return;
    const shownKeys=new Set([...list.children].map(x=>x.dataset.k));
    const src2=(feedGroup!=='all')?FEED.filter(c=>c.kind===feedGroup):FEED;
    const more2=src2.map(c=>({c,w:feedWeight(c)})).filter(p=>!shownKeys.has(p.c.key))
                    .sort((a,b)=>b.w-a.w).slice(0,feedBatch).map(p=>p.c);
    if(!more2.length){ document.getElementById('feedmore').textContent='今天的池子见底了 —— 去别的页看看,或者明天再来'; feedIO.disconnect(); return; }
    list.insertAdjacentHTML('beforeend',more2.map(fcard).join(''));
    mathify(list);
    markSeen(more2);
  },{rootMargin:'400px'});
  feedIO.observe(more);
  markSeen([...document.querySelectorAll('#feedlist .fcard')].map(x=>({key:x.dataset.k,kind:'?'})));
}
let seenQueue=[], seenTimer=null;
async function flushSeen(){
  const q=seenQueue.splice(0); if(!q.length||!sb)return;
  await sb.from('feed_events').insert(q);
}
function markSeen(cards){
  cards.forEach(c=>{ const k=c.key||c; feKey(k).seen++; seenQueue.push({card_key:k,kind:c.kind||'card',action:'seen'}); });
  clearTimeout(seenTimer);
  seenTimer=setTimeout(flushSeen,800);
  // 关标签/切后台时兜底,否则最后一批浏览记录会丢(实测滚 7 屏只落库了 2 屏)
  if(!markSeen._bound){ markSeen._bound=true;
    addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')flushSeen(); });
    addEventListener('pagehide',flushSeen); }
}

function dueLabel(iso){
  if(!iso)return '<span class="muted">无截止日期</span>';
  const d=new Date(iso), now=new Date();
  const txt=new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  const hrs=(d-now)/36e5;
  if(hrs<0)   return `<span class="muted">已截止 · ${txt}</span>`;
  if(hrs<48)  return `<b style="color:var(--accent)">${txt} 截止 · 剩 ${Math.floor(hrs)} 小时</b>`;
  return `${txt} 截止 · 剩 ${Math.ceil(hrs/24)} 天`;
}

function qaCard(q){
  return `<div style="border-left:3px solid var(--accent);background:var(--well);border-radius:0 9px 9px 0;
      padding:8px 12px;margin:10px 0;cursor:pointer" onclick="closeOv();openQA('${q.id}')">
    <div style="font-size:12px;color:var(--accent)">你在这里问过 · ${dayOf(q.asked_at)}</div>

}
// 把挂在本节课的问答按 anchor 插到对应小节末尾;没有 anchor 或匹配不上的收在最后
function lectureBody(l){
  let html = md(l.summary_md) || '<p class="empty">暂无讲义</p>';
  const qs = D.qa.filter(q=>q.lecture_id===l.id);
  const rest = [];
  qs.forEach(q=>{
    if(!q.anchor){rest.push(q);return;}
    const key = q.anchor.replace(/\s/g,'');
    // 找到标题文本包含 anchor 的那个 <hN>,插到下一个 <hN> 之前(即该节末尾)
    const re = /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/g;
    let m, start=-1, end=html.length;
    while((m = re.exec(html))!==null){
      const txt = m[1].replace(/<[^>]*>/g,'').replace(/\s/g,'');
      if(start<0 && txt.includes(key)){ start = m.index; }
      else if(start>=0){ end = m.index; break; }
    }
    if(start<0){rest.push(q);return;}
    html = html.slice(0,end) + qaCard(q) + html.slice(end);
  });
  if(rest.length) html += `<div style="margin-top:12px"><b style="font-size:13.5px">读这节笔记时的问题与反思</b>`
    + rest.map(qaCard).join('') + `</div>`;
  return html;
}

      <button class="btn mini ${kbKey?'':'ghost'}" onclick="kbKey=!kbKey;kbTopic='';render()">重点</button>
      ${seg}</div>
    <div class="card">${kbView==='map'?rMap(list):list.map(rowKP).join('')||'<div class="empty">空</div>'}</div>`;
}
function rMap(list){
  // 主题思维导图:无主题筛选时画主题总览,选了主题画该主题的条目图;边 = 正文 [[slug]] 引用
  if(!kbTopic){
    const groups={};
    list.forEach(k=>{const t=k.topic||'未分类';(groups[t]=groups[t]||[]).push(k);});
    const names=Object.keys(groups).sort();
    return svgRadial('统计知识库',names.map(t=>({label:t+' ('+groups[t].length+')',
      onclick:`kbTopic='${t}';render()`})),[]);
  }
  if(!list.length)return'<div class="empty">空</div>';
  const idx={};list.forEach((k,i)=>idx[k.slug]=i);
  const edges=[];
  list.forEach((a,i)=>{const m=(a.body_md||'').match(/\[\[([a-z0-9-]+)\]\]/g)||[];
    m.forEach(x=>{const s=x.slice(2,-2);if(s in idx&&idx[s]!==i)edges.push([i,idx[s]]);});});
  return svgRadial(kbTopic,list.map(k=>({label:(k.title_zh||k.title_en).slice(0,10),
    onclick:`openKP('${k.id}')`,dim:k.status==='stub'})),edges);
}
function svgRadial(center,nodes,edges){
  const N=nodes.length;if(!N)return'<div class="empty">空</div>';
  const R=Math.max(120,N*22),cx=R+110,cy=R+40,W=2*cx,H=2*cy-20;
  const pos=nodes.map((_,i)=>{const a=i*2*Math.PI/N-Math.PI/2;
    return [cx+R*Math.cos(a),cy+R*Math.sin(a),a];});
  let s=`<div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,720)}px;width:100%">`;
  s+=pos.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="1"/>`).join('');
  s+=edges.map(([i,j])=>`<line x1="${pos[i][0]}" y1="${pos[i][1]}" x2="${pos[j][0]}" y2="${pos[j][1]}" stroke="var(--accent)" stroke-width="1.3" opacity="0.55"/>`).join('');
  s+=`<circle cx="${cx}" cy="${cy}" r="34" fill="var(--accent)"/><text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#fff" font-size="12">${esc(center).slice(0,12)}</text>`;
  s+=nodes.map((n,i)=>{const [x,y,a]=pos[i];const right=Math.cos(a)>=0;
    return `<g style="cursor:pointer" onclick="${n.onclick}">
      <circle cx="${x}" cy="${y}" r="7" fill="${n.dim?'var(--faint)':'var(--accent)'}"/>
      <text x="${x+(right?11:-11)}" y="${y+4}" text-anchor="${right?'start':'end'}" fill="var(--ink)" font-size="12.5">${esc(n.label)}</text></g>`;}).join('');
  return s+`</svg></div><div class="muted" style="margin-top:6px">紫线 = 条目间引用;点节点打开${kbTopic?';<a href="javascript:void(0)" onclick="kbTopic=\'\';render()">← 回主题总览</a>':''}</div>`;
}
function srcOne(s){
  if(s.book_path)return `<a class="srcbtn" href="javascript:void(0)" onclick="openBook('${esc(s.book_path)}',${(+s.book_page)||1})">${esc(s.label)}${s.locator?' · '+esc(s.locator):''} 📖</a>`;
  if(s.path)return `<a class="srcbtn" href="javascript:void(0)" onclick="openPrivate('${esc(s.path)}')">${esc(s.label)}${s.locator?' · '+esc(s.locator):''} 🔒</a>`;
  if(s.lecture_id)return `<a class="srcbtn" href="javascript:void(0)" onclick="openLecture('${esc(s.lecture_id)}')">${esc(s.label)}${s.locator?' · '+esc(s.locator):''} →</a>`;
  if(s.meeting_id)return `<a class="srcbtn" href="javascript:void(0)" onclick="openMeetingNote('${esc(s.meeting_id)}')">${esc(s.label)} →</a>`;
  if(!s.url)return `<span class="srcbtn" style="cursor:default">${esc(s.label)}${s.locator?' · '+esc(s.locator):''}</span>`;
  return `<a class="srcbtn" target="_blank" href="${esc(s.url)}">${esc(s.label)}${s.locator?' · '+esc(s.locator):''} ↗</a>`;
}
async function openMeetingNote(mid){
  const {data}=await sb.from('meeting_notes').select('*').eq('meeting_id',mid).limit(1);
  const n=(data||[])[0];
  openOv(`<h3>${esc(n?n.title||'组会记录':'组会记录')}</h3>
    <div class="md kp-body">${n?md(n.zh||n.content):'<p class="empty">没找到这条组会记录。</p>'}</div>`);
}
function openKP(id){
  const k=D.kp.find(x=>x.id===id);if(!k)return;
  const srcs=(k.sources||[]).map(srcOne).join('');
  const qas=D.qa.filter(q=>(q.kp_slugs||[]).includes(k.slug));
  const backs=D.kp.filter(o=>o.id!==k.id&&(o.body_md||'').includes('[['+k.slug+']]'));
  const rev=k.review_count?`回顾 ${k.review_count} 次 · 上次 ${dayOf(k.last_reviewed_at)}`:'还没回顾过';
  openOv(`<h3>${esc(k.title_zh||k.title_en)}</h3>
    <div class="muted">${esc(k.title_en)} · <span class="chip k-${k.kind}">${KINDZH[k.kind]}</span>
      <span class="chip st-${k.status}">${STZH[k.status]}</span> · ${esc(k.topic||'')}</div>
    <div style="background:var(--well);border-radius:9px;padding:7px 10px;margin:8px 0;font-size:13px">
      <b>来源</b>:${ORIGIN_ZH[k.origin]||esc(k.origin||'')}<br>${srcs||'<span class="muted">(待补)</span>'}</div>
    <div class="md kp-body">${k.body_md?md(k.body_md):'<p class="empty">还没写 —— 已排入我的写作队列。</p>'}</div>
    ${qas.length?`<div style="margin-top:12px"><b style="font-size:13.5px">你的问题与反思</b>`+
      qas.map(q=>`<div class="row" onclick="openQA('${q.id}')"><div class="t">${esc(q.question)}</div>
        <div class="m">${dayOf(q.asked_at)} · ${esc(q.window_name||'')}</div></div>`).join('')+`</div>`:''}
    ${backs.length?`<div style="margin-top:10px" class="muted">被引用于:`+
      backs.map(o=>`<a class="srcbtn" href="javascript:void(0)" onclick="closeOv();openKP('${o.id}')">${esc(o.title_zh||o.title_en)}</a>`).join('')+`</div>`:''}
    <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
      <button class="btn" onclick="markReviewed('${k.id}')">✓ 我看过了</button>
      <span class="muted">${rev}</span></div>`);
}
async function markReviewed(id){
  const k=D.kp.find(x=>x.id===id);
  const r1=await sb.from('kp_reviews').insert({kp_id:id});
  const r2=await sb.from('knowledge_points').update({last_reviewed_at:new Date().toISOString(),
    review_count:(k.review_count||0)+1}).eq('id',id);
  if(r1.error||r2.error)return toast('失败: '+(r1.error||r2.error).message);
  toast('已记录这次回顾');closeOv();loadAll();
}

/* ---------- 术语 ---------- */
let tQ='';
function rTerms(){
  let list=D.kp.filter(k=>k.kind==='term').sort((a,b)=>a.title_en.localeCompare(b.title_en));
  if(tQ){const q=tQ.toLowerCase();list=list.filter(k=>
    (k.title_en+' '+(k.title_zh||'')+' '+(k.body_md||'')).toLowerCase().includes(q));}
  return `<div class="toolrow"><input type="search" placeholder="搜术语…" value="${esc(tQ)}" oninput="tQ=this.value;render()">
      <span class="muted">${list.length} 条</span></div>
    <div class="card">${list.map(k=>`<div class="row" onclick="openKP('${k.id}')">
      <div class="t"><b>${esc(k.title_en)}</b> — ${esc(k.title_zh||'')}</div>
      <div class="m">${esc((k.body_md||'').split('\n')[0].slice(0,90))}</div></div>`).join('')||'<div class="empty">空</div>'}</div>`;
}

async function openBook(path,page){
  const {data,error}=await sb.storage.from('learnfiles').createSignedUrl(path,3600);
  if(error||!data)return toast('打不开: '+((error&&error.message)||'无权限'));
  window.open(data.signedUrl+'#page='+page,'_blank');
}

/* ---------- 英语 ---------- */
let eQ='', eKind='';
const EN_KIND={word:'单词',phrase:'短语',pattern:'句式',usage:'用法'};
function rEN(){
  let list=D.en.slice();
  if(eKind)list=list.filter(x=>x.kind===eKind);
  if(eQ){const q=eQ.toLowerCase();list=list.filter(x=>
    (x.term+' '+(x.meaning_zh||'')+' '+(x.context||'')+' '+(x.note_md||'')).toLowerCase().includes(q));}
  const never=D.en.filter(x=>!x.review_count).length;
  const kinds=Object.keys(EN_KIND).filter(k=>D.en.some(x=>x.kind===k));
  return `<div class="toolrow"><input type="search" placeholder="搜英语…" value="${esc(eQ)}" oninput="eQ=this.value;render()">
      <span class="muted">${list.length} / ${D.en.length} 条 · 没复习过 ${never}</span></div>
    <div class="toolrow"><button class="chip${eKind?'':' on'}" onclick="eKind='';render()">全部</button>
      ${kinds.map(k=>`<button class="chip${eKind===k?' on':''}" onclick="eKind='${k}';render()">${EN_KIND[k]}</button>`).join('')}</div>
    <div class="card">${list.map(x=>`<div class="row" onclick="openEN('${x.id}')">
      <div class="t"><b>${esc(x.term)}</b> <span class="chip">${EN_KIND[x.kind]||x.kind}</span>
        ${x.review_count?`<span class="stars">看过 ${x.review_count} 次</span>`:''}</div>
      <div class="m">${esc(x.meaning_zh)}${x.source?' · '+esc(x.source):''}</div></div>`).join('')||'<div class="empty">还没有记录</div>'}</div>`;
}
function openEN(id){
  const x=D.en.find(y=>y.id===id); if(!x)return;
  openOv(`<h3>${esc(x.term)} <span class="chip">${EN_KIND[x.kind]||x.kind}</span></h3>
    <div class="md"><p><b>${esc(x.meaning_zh)}</b></p>
    ${x.context?`<blockquote>${esc(x.context)}</blockquote>`:''}
    ${md(x.note_md||'')}
    ${x.source?`<p class="muted">出处:${esc(x.source)}
      ${x.source_path?`<button class="chip" onclick="openBook('${x.source_path}',${x.source_page||1})">📖 翻到原文</button>`:''}</p>`:''}
    ${(x.tags||[]).length?`<p>${x.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join(' ')}</p>`:''}</div>
    <div style="margin-top:14px"><button onclick="reviewEN('${x.id}')">✓ 我看过了${x.review_count?`（已 ${x.review_count} 次）`:''}</button></div>`);
}
async function reviewEN(id){
  const x=D.en.find(y=>y.id===id); if(!x)return;
  const {error}=await sb.from('english_log').update({
    last_reviewed_at:new Date().toISOString(), review_count:(x.review_count||0)+1}).eq('id',id);
  if(error)return toast('记不上: '+error.message);
  x.review_count=(x.review_count||0)+1; x.last_reviewed_at=new Date().toISOString();
  toast('记下了'); closeOv(); render();
}

/* ---------- 阅读 ---------- */
const RQ_ST={reading:'在读',queued:'排队',done:'读完',dropped:'放弃'};
function rqRow(r){
  const noRes=(r.kind==='book'||r.kind==='chapter')&&!r.link;
  return `<div class="row" onclick="openRead('${r.id}')">
    <div class="t">${esc(r.title)}
      <span class="chip st-${({reading:'draft',queued:'stub',done:'done',dropped:'stub'})[r.status]}">${RQ_ST[r.status]}</span>
      <span class="stars">${'★'.repeat(4-r.priority)}</span>
      ${noRes?'<span class="chip" style="color:var(--danger)">无资源·待你下载</span>':''}</div>
    <div class="m">来源:${esc(r.recommender||'(待补)')}${r.progress?' · '+esc(r.progress):''}</div></div>`;
}
function rRead(){
  const order={reading:0,queued:1,done:2,dropped:3};
  const bySt=(a,b)=>order[a.status]-order[b.status]||a.priority-b.priority;
  const papers=D.rq.filter(r=>r.kind==='paper').sort(bySt);
  const books=D.rq.filter(r=>r.kind==='book'||r.kind==='chapter').sort(bySt);
  const other=D.rq.filter(r=>!['paper','book','chapter'].includes(r.kind)).sort(bySt);
  let h=`<div class="card"><h2>书 <span class="n">${books.length} · 红标=还没有电子资源,你下载后发我路径</span></h2>`+
    (books.map(rqRow).join('')||'<div class="empty">空</div>')+`</div>`;
  h+=`<div class="card"><h2>文献 <span class="n">${papers.length} · 正典在 Notion 文献库,这里管排队</span></h2>`+
    (papers.map(rqRow).join('')||'<div class="empty">空</div>')+`</div>`;
  if(other.length)h+=`<div class="card"><h2>其他 <span class="n">${other.length}</span></h2>`+other.map(rqRow).join('')+`</div>`;
  return h;
}
function openRead(id){
  const r=D.rq.find(x=>x.id===id);if(!r)return;
  const links=[r.link&&['打开↗',r.link],r.notion_url&&['Notion↗',r.notion_url]].filter(Boolean)
    .map(([t,u])=>`<a class="srcbtn" target="_blank" href="${esc(u)}">${t}</a>`).join('');
  const noRes=(r.kind==='book'||r.kind==='chapter')&&!r.link;
  openOv(`<h3>${esc(r.title)}</h3>
    <div class="muted">${esc(r.kind)} · 优先级 ${r.priority}</div>
    <div style="background:var(--well);border-radius:9px;padding:7px 10px;margin:8px 0;font-size:13px">
      <b>来源</b>:${esc(r.recommender||'(待补)')}
      ${noRes?'<br><span style="color:var(--danger)">还没有电子资源 —— 你下载后把文件丢进 Drive 书目录或发我路径,我挂上链接</span>':''}</div>
    <div style="margin:6px 0">${links}</div>
    ${r.note?`<div class="md">${md(r.note)}</div>`:''}
    <label>进度备注</label><input id="rq-prog" value="${esc(r.progress||'')}">
    <div class="toolrow" style="margin-top:12px">
      ${['queued','reading','done','dropped'].map(s=>`<button class="btn mini ${r.status===s?'':'ghost'}"
        onclick="setRead('${r.id}','${s}')">${({queued:'排队',reading:'在读',done:'读完',dropped:'放弃'})[s]}</button>`).join('')}
    </div>`);
}
async function setRead(id,st){
  const prog=document.getElementById('rq-prog')?.value||null;
  const {error}=await sb.from('reading_queue').update({status:st,progress:prog,updated_at:new Date().toISOString()}).eq('id',id);
  if(error)return toast('失败: '+error.message);
  closeOv();toast('已更新');loadAll();
}

/* ---------- 问答 ---------- */
let qQ='';
function rowQA(q){
  return `<div class="row" onclick="openQA('${q.id}')">
    <div class="t">${esc(q.question)}</div>
    <div class="m">${dayOf(q.asked_at)} · ${esc(q.window_name||'')}${q.topic?' · '+esc(q.topic):''}</div></div>`;
}
function rQA(){
  let list=D.qa;
  if(qQ){const q=qQ.toLowerCase();list=list.filter(x=>
    (x.question+' '+(x.answer_md||'')).toLowerCase().includes(q));}
  return `<div class="toolrow"><input type="search" placeholder="搜我问过的问题…" value="${esc(qQ)}" oninput="qQ=this.value;render()">
      <span class="muted">${list.length} 条</span></div>
    <div class="card">${list.map(rowQA).join('')||'<div class="empty">还没有问答记录</div>'}</div>`;
}
function openQA(id){
  const q=D.qa.find(x=>x.id===id);if(!q)return;
  const kps=(q.kp_slugs||[]).map(s=>{
    const k=D.kp.find(k=>k.slug===s);
    return k?`<a class="srcbtn" href="javascript:closeOv();openKP('${k.id}')">${esc(k.title_zh||k.title_en)}</a>`:'';
  }).join('');
  openOv(`<h3 style="font-weight:600">${esc(q.question)}</h3>
    <div class="muted">${dayOf(q.asked_at)} · ${esc(q.window_name||'')}</div>
    ${(q.my_thought_en||q.my_thought)?`<details class="kps" open style="margin-top:10px">
      <summary>我当时是怎么想的${q.my_thought_en&&q.my_thought?' (原文 / 中文)':''}</summary>
      ${q.my_thought_en?`<div class="md" style="background:var(--well);border-radius:9px;padding:8px 12px;margin-top:6px">${md(q.my_thought_en)}</div>`:''}
      ${q.my_thought?`<div class="md" style="background:var(--well);border-radius:9px;padding:8px 12px;margin-top:6px">${md(q.my_thought)}</div>`:''}
      </details>`:''}
    <div class="md kp-body">${q.answer_md?md(q.answer_md):'<p class="empty">答案还没归档。</p>'}</div>
    ${kps?`<div style="margin-top:10px"><span class="muted">相关知识点:</span> ${kps}</div>`:''}`);
}

/* ---------- overlay / add ---------- */
function openOv(html){
  document.getElementById('sheet').innerHTML=html+
    `<div style="text-align:right;margin-top:14px"><button class="btn ghost" onclick="closeOv()">关闭</button></div>`;
  document.getElementById('ov').classList.add('on');
  mathify(document.getElementById('sheet'));
}
function closeOv(){document.getElementById('ov').classList.remove('on');}
let addType='study';
function openAdd(){
  const seg=(t,zh)=>`<button class="${addType===t?'on':''}" onclick="addType='${t}';openAdd()">${zh}</button>`;
  let fields='';
  if(addType==='study')fields=`<label>今天学到/遇到了什么</label><textarea id="a1" placeholder="一句话"></textarea>
    <label>分类(可空)</label><input id="a2" placeholder="course / self / paper …">
    <label>链接(可空)</label><input id="a3">`;
  if(addType==='kp')fields=`<label>标题(英文)</label><input id="a1" placeholder="empirical Bayes">
    <label>标题(中文,可空)</label><input id="a2">
    <label>为什么想记 / 哪里不懂(可空)</label><textarea id="a3"></textarea>`;
  if(addType==='read')fields=`<label>标题</label><input id="a1">
    <label>链接(可空)</label><input id="a2">
    <label>谁推荐的(可空)</label><input id="a3">`;
  if(addType==='qa')fields=`<label>问题</label><textarea id="a1" placeholder="我想知道…"></textarea>
    <label>主题(可空)</label><input id="a2">`;
  openOv(`<h3>记一条</h3>
    <div class="seg" style="margin:10px 0">${seg('study','学到')}${seg('kp','知识点')}${seg('read','想读')}${seg('qa','提问')}</div>
    ${fields}<div style="margin-top:14px"><button class="btn" onclick="saveAdd()">保存</button></div>`);
}
async function saveAdd(){
  const v=i=>document.getElementById('a'+i)?.value?.trim()||null;
  let r={};
  try{
    if(addType==='study')r=await sb.from('study_log').insert({takeaway:v(1),category:v(2),link:v(3),source:'web',study_on:todayStr()});
    if(addType==='kp')r=await sb.from('knowledge_points').insert({slug:(v(1)||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
      title_en:v(1),title_zh:v(2),body_md:null,status:'stub',origin:'manual',topic:null,kind:'concept',
      sources:v(3)?[{label:'她的疑问',url:'',locator:v(3)}]:[]});
    if(addType==='read')r=await sb.from('reading_queue').insert({title:v(1),link:v(2),recommender:v(3)||'自查'});
    if(addType==='qa')r=await sb.from('qa_log').insert({question:v(1),topic:v(2),window_name:'web'});
  }catch(e){return toast('失败: '+e.message)}
  if(r.error)return toast('失败: '+r.error.message);
  closeOv();toast('已记下,我这边会跟进');loadAll();
}
boot();
</script>
